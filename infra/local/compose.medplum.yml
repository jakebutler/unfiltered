# Local synthetic qualification only. No external email, cloud, or inference service.
# Based on Medplum's Apache-2.0 full-stack example at tag v5.2.3.
name: unfiltered-medplum-s0
services:
  storage-init:
    image: medplum/medplum-server:5.2.3@sha256:8fef2634b0936fc95d11ce3fca881adf66fa725e63228223a91b98cda9b8a3ee
    user: '0:0'
    entrypoint: ['node', '-e']
    command: ['const fs = require("node:fs"); fs.mkdirSync("/var/medplum/binary", { recursive: true }); fs.chownSync("/var/medplum/binary", 1000, 1000); fs.chmodSync("/var/medplum/binary", 0o700);']
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: ['no-new-privileges:true']
    volumes:
      - binary-data:/var/medplum/binary
  postgres:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    environment:
      POSTGRES_USER: medplum
      POSTGRES_PASSWORD: ${MEDPLUM_DATABASE_PASSWORD:?Run infra/local/init.mjs}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command: ['postgres', '-c', 'statement_timeout=60000', '-c', 'default_transaction_isolation=REPEATABLE READ', '-c', 'shared_preload_libraries=pg_stat_statements,auto_explain']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medplum']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
    environment:
      REDIS_PASSWORD: ${MEDPLUM_REDIS_PASSWORD:?Run infra/local/init.mjs}
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 5s
      timeout: 5s
      retries: 20
  server:
    image: medplum/medplum-server:5.2.3@sha256:8fef2634b0936fc95d11ce3fca881adf66fa725e63228223a91b98cda9b8a3ee
    depends_on:
      storage-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - '127.0.0.1:8103:8103'
    command: ['env']
    environment:
      MEDPLUM_PORT: 8103
      MEDPLUM_BASE_URL: 'http://localhost:8103/'
      MEDPLUM_APP_BASE_URL: 'http://localhost:3000/'
      MEDPLUM_STORAGE_BASE_URL: 'http://localhost:8103/storage/'
      MEDPLUM_DATABASE_HOST: postgres
      MEDPLUM_DATABASE_PORT: 5432
      MEDPLUM_DATABASE_DBNAME: medplum
      MEDPLUM_DATABASE_USERNAME: medplum
      MEDPLUM_DATABASE_PASSWORD: ${MEDPLUM_DATABASE_PASSWORD:?Run infra/local/init.mjs}
      MEDPLUM_REDIS_HOST: redis
      MEDPLUM_REDIS_PORT: 6379
      MEDPLUM_REDIS_PASSWORD: ${MEDPLUM_REDIS_PASSWORD:?Run infra/local/init.mjs}
      MEDPLUM_DEFAULT_SUPER_ADMIN_EMAIL: ${MEDPLUM_DEFAULT_SUPER_ADMIN_EMAIL:?Run infra/local/init.mjs}
      MEDPLUM_DEFAULT_SUPER_ADMIN_PASSWORD: ${MEDPLUM_DEFAULT_SUPER_ADMIN_PASSWORD:?Run infra/local/init.mjs}
      MEDPLUM_DEFAULT_SUPER_ADMIN_CLIENT_ID: ${MEDPLUM_DEFAULT_SUPER_ADMIN_CLIENT_ID:?Run infra/local/init.mjs}
      MEDPLUM_DEFAULT_SUPER_ADMIN_CLIENT_SECRET: ${MEDPLUM_DEFAULT_SUPER_ADMIN_CLIENT_SECRET:?Run infra/local/init.mjs}
      MEDPLUM_BINARY_STORAGE: 'file:/var/medplum/binary/'
      MEDPLUM_ALLOWED_ORIGINS: 'http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173'
      MEDPLUM_MAX_JSON_SIZE: '1mb'
      MEDPLUM_MAX_BATCH_SIZE: '10mb'
      MEDPLUM_VM_CONTEXT_BOTS_ENABLED: 'false'
    volumes:
      - binary-data:/var/medplum/binary
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://localhost:8103/healthcheck").then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  app:
    image: medplum/medplum-app:5.2.3@sha256:b6a4243b107d7715e8d4b2d4376278376f4abb7967b90913e00a5650e799ceeb
    depends_on:
      server: { condition: service_healthy }
    ports:
      - '127.0.0.1:3000:3000'
volumes:
  postgres-data:
  binary-data:
