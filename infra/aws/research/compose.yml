{
  "services": {
    "backend": {
      "image": "ghcr.io/get-convex/convex-backend@sha256:d715e9ec088784407ca4ba2d3db592702cd328d02c76cdca3852c0018f2a76b4",
      "platform": "linux/amd64", "restart": "no", "stop_signal": "SIGINT", "stop_grace_period": "30s", "mem_limit": "1g", "cpus": 1, "pids_limit": 128,
      "volumes": ["${RESEARCH_METADATA_DIRECTORY:?explicit sealed metadata directory required}:/convex/data"],
      "ports": ["127.0.0.1:3210:3210", "127.0.0.1:3211:3211"],
      "environment": {"CONVEX_CLOUD_ORIGIN": "${RESEARCH_CONVEX_ORIGIN:?explicit HTTPS origin required}", "CONVEX_SITE_ORIGIN": "${RESEARCH_CONVEX_SITE_ORIGIN:?explicit HTTPS origin required}", "DISABLE_BEACON": "true", "DISABLE_METRICS_ENDPOINT": "true", "REDACT_LOGS_TO_CLIENT": "true", "RUST_LOG": "warn"},
      "logging": {"driver": "none"}
    },
    "application": {
      "image": "${RESEARCH_IMAGE:?explicit built digest required}", "platform": "linux/amd64", "restart": "no", "read_only": true, "network_mode": "host",
      "cap_drop": ["ALL"], "security_opt": ["no-new-privileges:true"], "mem_limit": "768m", "cpus": 1, "pids_limit": 128,
      "tmpfs": ["/tmp:rw,noexec,nosuid,size=16m"], "volumes": ["${RESEARCH_RUNTIME_FILE:?explicit mode0400 runtime required}:/run/secrets/research-runtime.json:ro", "${RESEARCH_BINDING_FILE:?explicit volume/profile binding required}:/run/secrets/research-binding.json:ro", "${RESEARCH_ADMISSION_DIRECTORY:?explicit accepted admission directory required}:/run/research-gate:ro"], "logging": {"driver": "none"}
    }
  }
}
